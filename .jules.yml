# Jules Continuous AI Configuration
version: "1.0"

# Automation Rules - these will be imported as scheduled tasks
automationRules:
  - id: "daily_codebase_scan"
    name: "Daily Codebase Scan"
    description: "Scan codebase for TODOs, FIXME, and BUG comments daily"
    trigger: "schedule"
    schedule: "0 9 * * *" # 9 AM daily
    enabled: true
    actions:
      - type: "scan"
        target: "suggested-tasks"
        params:
          searchPatterns: ["TODO", "FIXME", "BUG", "HACK"]

  - id: "weekly_dependency_check"
    name: "Weekly Dependency Security Check"
    description: "Check for vulnerabilities in dependencies weekly"
    trigger: "schedule"
    schedule: "0 10 * * MON" # 10 AM Mondays
    enabled: true
    actions:
      - type: "audit"
        target: "npm"
        params:
          fix: true

  - id: "daily_test_validation"
    name: "Daily Test Suite Validation"
    description: "Run full test suite and report results"
    trigger: "schedule"
    schedule: "0 22 * * *" # 10 PM daily
    enabled: true
    actions:
      - type: "test"
        target: "npm"
        params:
          suite: "all"

  - id: "daily_render_deployment"
    name: "Daily Render Deployment Check"
    description: "Check Render deployment status and logs"
    trigger: "schedule"
    schedule: "0 6 * * *" # 6 AM daily
    enabled: true
    actions:
      - type: "deploy"
        target: "render"
        params:
          service: "mcp-brunella-core"

  - id: "git_sync_schedule"
    name: "Git Sync Schedule"
    description: "Auto-sync git commits every 4 hours"
    trigger: "schedule"
    schedule: "0 */4 * * *" # Every 4 hours
    enabled: true
    actions:
      - type: "git"
        target: "sync"
        params:
          retry: true
          pushChanges: true

# Workflows for manual or event-based triggers
workflows:
  - name: "Emergency Code Review"
    description: "Immediate code review for critical issues"
    trigger: "manual"
    steps:
      - name: "Scan for issues"
        action: "scan_critical"
      - name: "Notify reviewers"
        action: "notify"
        config:
          channels: ["slack", "email"]

  - name: "Release Preparation"
    description: "Prepare a new release"
    trigger: "manual"
    steps:
      - name: "Run tests"
        action: "test"
      - name: "Build package"
        action: "build"
      - name: "Generate changelog"
        action: "changelog"
      - name: "Create release"
        action: "release"
