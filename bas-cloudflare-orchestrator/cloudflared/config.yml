# Cloudflare Tunnel Configuration for BAS (Brunella Agent System)
# 
# Setup Instructions:
# 1. Run: cloudflared tunnel login
# 2. Create tunnel: cloudflared tunnel create bas-local-bridge
# 3. Copy tunnel UUID and credentials file path below
# 4. Run tunnel: cloudflared tunnel --config ./cloudflared/config.yml run

# TUNNEL CONFIGURATION
# Replace <TUNNEL_UUID> with your actual tunnel ID (from step 2)
tunnel: <TUNNEL_UUID>

# Replace <PATH_TO_CREDENTIALS> with the credentials file path
# Windows example: C:\Users\YourUser\.cloudflared\<UUID>.json
# Linux example: /home/youruser/.cloudflared/<UUID>.json
credentials-file: <PATH_TO_CREDENTIALS>

# INGRESS RULES
# Routes external requests to local services
ingress:
  # n8n webhook endpoint (workflow automation)
  - hostname: n8n-bas.trycloudflare.com
    service: http://localhost:5678
    
  # Browser-Use / myai Python server (Robotkéz callbacks)
  - hostname: browser-bas.trycloudflare.com
    service: http://localhost:8000
    
  # BAS Express API (main backend)
  - hostname: api-bas.trycloudflare.com
    service: http://localhost:3000
  
  # Dashboard (Vite dev server)
  - hostname: dashboard-bas.trycloudflare.com
    service: http://localhost:5173
    
  # Catch-all: return 404 for undefined routes
  - service: http_status:404

# OPTIONAL: Logging configuration
# Uncomment to enable detailed logs
# loglevel: debug
# logfile: ./cloudflared/tunnel.log

# NOTES:
# - trycloudflare.com hostnames are examples - actual URLs will be assigned
# - If no domain, use: cloudflared tunnel --url http://localhost:3000 (auto URL)
# - For production, replace with custom domain (e.g., bas.yourdomain.com)
# - Ensure all services are running before starting tunnel
