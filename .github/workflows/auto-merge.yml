name: Auto-Merge Bot PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]
  check_suite:
    types: [completed]

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.user.login == 'julesai' || 
      github.event.pull_request.user.login == 'github-actions[bot]' ||
      contains(github.event.pull_request.labels.*.name, 'auto-merge')
    
    steps:
      - name: Check if CI passed
        uses: actions/github-script@v7
        id: check-ci
        with:
          script: |
            const { data: checks } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha
            });
            
            const required = ['node', 'vitest', 'python'];
            const allPassed = required.every(name => 
              checks.check_runs.some(check => 
                check.name === name && check.conclusion === 'success'
              )
            );
            
            return allPassed;
      
      - name: Auto-merge PR
        if: steps.check-ci.outputs.result == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
              merge_method: 'squash',
              commit_title: `${context.payload.pull_request.title} (#${context.payload.pull_request.number})`,
            });
            
            console.log('✅ Auto-merged successfully!');
      
      - name: Delete branch after merge
        if: steps.check-ci.outputs.result == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${context.payload.pull_request.head.ref}`
              });
              console.log('✅ Branch deleted after merge');
            } catch (error) {
              console.log('⚠️ Could not delete branch:', error.message);
            }
