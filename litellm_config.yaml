# LiteLLM Proxy Configuration for Brunella AI System
# Version: 1.0
# Last Updated: 2026-02-24

model_list:
  # === GitHub Models (Free for GitHub Pro+ users) ===
  - model_name: gpt-4o
    litellm_params:
      model: github/gpt-4o
      api_base: https://models.inference.ai.azure.com
      api_key: os.environ/GITHUB_PAT
      
  - model_name: gpt-4-turbo
    litellm_params:
      model: github/gpt-4-turbo
      api_base: https://models.inference.ai.azure.com
      api_key: os.environ/GITHUB_PAT

  # === Google Gemini ===
  - model_name: gemini-2.0-flash
    litellm_params:
      model: gemini/gemini-2.0-flash-exp
      api_key: os.environ/GEMINI_API_KEY
      
  - model_name: gemini-pro
    litellm_params:
      model: gemini/gemini-1.5-pro-latest
      api_key: os.environ/GEMINI_API_KEY

  # === Anthropic Claude ===
  - model_name: claude-3-5-sonnet
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: os.environ/ANTHROPIC_API_KEY

  # === OpenAI (Direct) ===
  - model_name: gpt-4o-openai
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  # === Ollama (Local) ===
  - model_name: qwen2.5-coder
    litellm_params:
      model: ollama/qwen2.5-coder:7b
      api_base: http://localhost:11434

router_settings:
  routing_strategy: least-busy
  allowed_fails: 3
  num_retries: 2
  retry_after: 0
  cooldown_time: 1

general_settings:
  # Master key for LiteLLM proxy authentication (optional)
  # master_key: os.environ/LITELLM_MASTER_KEY
  
  # Drop unsupported parameters to avoid API errors
  drop_params: true
  
  # Enable detailed logging
  set_verbose: false
  
  # Success callback (optional - for analytics)
  # success_callback: ["langfuse"]

# === Callbacks (Optional) ===
# litellm_settings:
#   success_callback: ["langfuse"]
#   langfuse_public_key: os.environ/LANGFUSE_PUBLIC_KEY
