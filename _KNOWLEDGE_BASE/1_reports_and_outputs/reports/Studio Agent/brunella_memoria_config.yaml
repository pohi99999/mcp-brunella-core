## 📌 Referencia: Parancssori környezetek döntési fája

```
                       🖥 Milyen feladatot végzel?
                                  │
             ┌────────────────────┼────────────────────┐
             │                    │                    │
      🔧 Rendszer admin    💻 Fejlesztés           ☁️ Felhő / DevOps
             │                    │                    │
       ┌─────┴─────┐       ┌──────┴─────────┐        ┌───────────────┐
       │           │       │                │        │               │
  Windows admin  Script   Visual Studio   Git &      Azure Cloud   Linux tools
 (services, reg) írása    build (C++/C#)  Bash env.  / Infra Mgmt   (AI, Docker)
       │           │            │            │            │              │
       │           │            │            │            │              │
Windows PS   PowerShell 7   Dev PowerShell   Git Bash   Azure Cloud   Ubuntu (WSL)
 (legacy)      (modern)                         │          Shell
                                               Git CMD*
(*Ha Windows CMD stílus kell, de ritkán használt)
```

### Rövid ajánló
- **PowerShell 7** → modern scripting, automatizálás.  
- **Windows PowerShell** → régi modulokhoz.  
- **Developer PowerShell** → Visual Studio build.  
- **Azure Cloud Shell** → felhő-admin / DevOps.  
- **Git Bash** → Git + Linux-szerű környezet.  
- **Ubuntu (WSL)** → teljes Linux eszközkészlet (Docker, ML, AI).  
