name: Jules Test Coordinator (Daily Summary)

on:
  schedule:
    - cron: "0 8 * * *" # Every day at 8 AM UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  coordinator:
    name: Daily Test Summary
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Fetch last 24h workflow runs
        id: fetch_runs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Fetch Jules Async Tests workflow runs from last 24h
            const since = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();

            const { data: workflows } = await github.rest.actions.listRepoWorkflows({
              owner,
              repo,
            });

            const julesWorkflow = workflows.workflows.find(w => w.name === 'Jules Async Tests');

            if (!julesWorkflow) {
              core.setOutput('summary', 'Jules Async Tests workflow not found');
              return;
            }

            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: julesWorkflow.id,
              created: `>=${since}`,
              per_page: 100,
            });

            // Aggregate results
            const total = runs.workflow_runs.length;
            const success = runs.workflow_runs.filter(r => r.conclusion === 'success').length;
            const failure = runs.workflow_runs.filter(r => r.conclusion === 'failure').length;
            const cancelled = runs.workflow_runs.filter(r => r.conclusion === 'cancelled').length;
            const inProgress = runs.workflow_runs.filter(r => r.status === 'in_progress').length;

            const passRate = total > 0 ? Math.round((success / total) * 100) : 0;

            const summary = `# 📊 Jules Async Tests - Daily Summary

            **Period:** Last 24 hours
            **Date:** ${new Date().toISOString().split('T')[0]}

            ## Results

            - ✅ **Success:** ${success} / ${total} (${passRate}%)
            - ❌ **Failed:** ${failure}
            - 🚫 **Cancelled:** ${cancelled}
            - 🔄 **In Progress:** ${inProgress}

            ## Status

            ${passRate >= 90 ? '🎉 **EXCELLENT** - System stable!' : ''}
            ${passRate >= 70 && passRate < 90 ? '⚠️ **GOOD** - Minor issues detected' : ''}
            ${passRate < 70 ? '🚨 **ACTION REQUIRED** - Multiple failures detected!' : ''}

            ## Recent Runs

            ${runs.workflow_runs.slice(0, 10).map(run => {
              const icon = run.conclusion === 'success' ? '✅' : run.conclusion === 'failure' ? '❌' : '⏸️';
              return \`\${icon} [\${run.name}](\${run.html_url}) - \${run.created_at}\`;
            }).join('\n')}
            `;

            core.setOutput('summary', summary);
            core.setOutput('pass_rate', passRate);
            core.setOutput('total_runs', total);

      - name: Post summary to GitHub
        uses: actions/github-script@v7
        with:
          script: |
            const summary = `${{ steps.fetch_runs.outputs.summary }}`;

            // Post as workflow summary
            await core.summary
              .addRaw(summary)
              .write();

            console.log('Summary posted to workflow');

      - name: Create issue if pass rate < 70%
        if: steps.fetch_runs.outputs.pass_rate < 70
        uses: actions/github-script@v7
        with:
          script: |
            const passRate = ${{ steps.fetch_runs.outputs.pass_rate }};
            const totalRuns = ${{ steps.fetch_runs.outputs.total_runs }};

            const body = `🚨 **Jules Async Tests Alert**

            The test pass rate has dropped below 70% in the last 24 hours.

            - **Pass Rate:** ${passRate}%
            - **Total Runs:** ${totalRuns}

            Please investigate the failing test suites and address the issues.

            ---
            *This issue was automatically created by Jules Test Coordinator.*`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[Alert] Jules Test Pass Rate Low: ${passRate}%`,
              body: body,
              labels: ['test-failure', 'automated', 'high-priority'],
            });

            console.log('Alert issue created');
