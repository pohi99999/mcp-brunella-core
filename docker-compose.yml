version: '3.8'

services:
  # Brunella Core (Node.js/TypeScript)
  backend:
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: brunella-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - BRUNELLA_PYTHON_API_URL=http://ai-worker:8000
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - BRUNELLA_WORKSPACE_ROOT=/app
      - BRUNELLA_WEBHOOK_SECRET=${BRUNELLA_WEBHOOK_SECRET}
    volumes:
      - .:/app # Bind mount full workspace for development
      - /app/node_modules # Persistent node_modules inside container
      - ./logs:/app/logs
    depends_on:
      - ai-worker
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # AI Subsystem (Python/FastAPI)
  ai-worker:
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: brunella-ai
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    volumes:
      - ./myai:/app/myai # Bind mount python code
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"

  n8n-sandbox:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_EDITOR_BASE_URL=http://localhost:5678
      - N8N_SECURE_COOKIE=false
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_TEST_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_TEST_PASSWORD}
      - LEADS_SHEET_ID=${GOOGLE_SHEETS_ID}
      - BRUNELLA_WEBHOOK_SECRET=${BRUNELLA_WEBHOOK_SECRET}
      - BRUNELLA_WORKSPACE_ROOT=/app
    volumes:
      - n8n_data:/home/node/.n8n
      - ./data:/app/data

volumes:
  n8n_data:
