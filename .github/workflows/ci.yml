name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, gemini-fication-v2]
  pull_request:
    branches: [main, develop, gemini-fication-v2]

jobs:
  build-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quick Node validation
        run: pnpm run test:fast
        env:
          WEB_UI_ENABLED: "0"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          ANYTHINGLLM_API_KEY: ${{ secrets.ANYTHINGLLM_API_KEY }}
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL }}
          N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
          N8N_TEST_URL: ${{ secrets.N8N_TEST_URL }}
          N8N_TEST_USER: ${{ secrets.N8N_TEST_USER }}
          N8N_TEST_PASSWORD: ${{ secrets.N8N_TEST_PASSWORD }}
          BRUNELLA_SKIP_SECRETS_CHECK: "1"

  build-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Python tests
        run: |
          if [ -d "myai" ] && find myai -name "*.py" -type f | grep -q .; then
            pytest myai/ --maxfail=1 --disable-warnings -v || echo "Python tests completed with warnings"
          else
            echo "No Python tests found in myai/ directory"
          fi
        env:
          PYTHONPATH: .

  python-shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.30.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Python venv
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt

      - name: Install Node deps & build
        run: pnpm install --frozen-lockfile && pnpm run build
      - name: PythonShell tests
        run: node --loader ts-node/esm --test test/python_shell.test.ts
        env:
          WEB_UI_ENABLED: "0"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter
        run: pnpm run lint
  

  integration-tests:
    name: Integration tests (DB migrations + Vitest)
    runs-on: ubuntu-latest
    needs: [build-node]
    steps:
      - uses: actions/checkout@v4

      - name: Setup sqlite3 (system package)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y sqlite3

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare test DB & run migrations
        shell: bash
        run: |
          set -euo pipefail
          # configurable paths (workflow/env can override DB_PATH / TEST_DB_PATH)
          MIGRATIONS_DIR="${MIGRATIONS_DIR:-$GITHUB_WORKSPACE/data/migrations}"
          DB_PATH="${DB_PATH:-$GITHUB_WORKSPACE/data/brunella.db}"
          TEST_DB_PATH="${TEST_DB_PATH:-$GITHUB_WORKSPACE/data/test_brunnella.db}"

          echo "MIGRATIONS_DIR=$MIGRATIONS_DIR"
          echo "DB_PATH=$DB_PATH"
          echo "TEST_DB_PATH=$TEST_DB_PATH"

          mkdir -p "$(dirname "$TEST_DB_PATH")"

          # Create empty sqlite DB if needed
          sqlite3 "$TEST_DB_PATH" "PRAGMA journal_mode=WAL;"

          # Apply SQL migrations from data/migrations
          if [ -d "$MIGRATIONS_DIR" ] && ls "$MIGRATIONS_DIR"/*.sql >/dev/null 2>&1; then
            for f in "$MIGRATIONS_DIR"/*.sql; do
              echo "Applying migration: $f"
              sqlite3 "$TEST_DB_PATH" < "$f"
            done
          else
            echo "No SQL migrations found in $MIGRATIONS_DIR"
          fi

          # Seed DB if seed SQL exists
          if [ -f "$MIGRATIONS_DIR/seed.sql" ]; then
            echo "Seeding test DB"
            sqlite3 "$TEST_DB_PATH" < "$MIGRATIONS_DIR/seed.sql"
          else
            echo "No seed.sql found; skipping seed step"
          fi

          # Emit a small .env.test file for integration tests to pick up; do NOT commit this
          printf 'NODE_ENV=test\nDB_PATH=%s\n' "$TEST_DB_PATH" > .env.test

      - name: Build TypeScript
        run: pnpm run build

      - name: Run integration Vitest suite
        run: npx vitest run test/integration --run
        env:
          NODE_ENV: test
          DB_PATH: ${{ github.workspace }}/data/test_brunnella.db
