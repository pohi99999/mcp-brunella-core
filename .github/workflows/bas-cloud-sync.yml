# BAS Hybrid Cloud Sync Workflow
# Szinkronizálja a lokális adatokat Cloudflare R2/D1-be

name: BAS Cloud Sync

on:
  # Manuális trigger
  workflow_dispatch:
    inputs:
      sync_type:
        description: "Szinkron típusa"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - snapshot
          - tracks

  # Ütemezett futtatás (naponta 2:00 UTC)
  schedule:
    - cron: "0 2 * * *"

  # Push a main-re (csak tracks.md változásnál)
  push:
    branches: [main]
    paths:
      - "conductor/tracks.md"
      - "conductor/tracks/**"

# Self-hosted runner szükséges a lokális fájlok eléréséhez
jobs:
  sync:
    name: Cloud Sync
    runs-on: self-hosted # Lokális runner: G:\Brunella\actions-runner

    steps:
      - name: Validate Secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd bas-cloudflare-orchestrator
          npm install

      - name: Wrangler Login Check
        run: |
          cd bas-cloudflare-orchestrator
          npx wrangler whoami
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Run Sync
        run: |
          cd myai
          python sync_to_r2.py ${{ github.event.inputs.sync_type || 'full' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LANCEDB_PATH: "F:/mcp-brunella-core/.lancedb"
          R2_BUCKET: "vodor1"
          R2_PREFIX: "Brunella_core"

      - name: Update D1 Metadata
        if: success()
        run: |
          cd bas-cloudflare-orchestrator
          # Validate sync_type to prevent SQL injection (only allow known values)
          SYNC_TYPE="${{ github.event.inputs.sync_type || 'full' }}"
          case "$SYNC_TYPE" in
            full|snapshot|tracks)
              npx wrangler d1 execute bas-metadata --command "INSERT INTO sync_log (sync_type, status, source) VALUES ('$SYNC_TYPE', 'completed', 'github-action')"
              ;;
            *)
              echo "Invalid sync_type: $SYNC_TYPE"
              exit 1
              ;;
          esac
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Notify on Failure
        if: failure()
        run: |
          echo "::error::BAS Cloud Sync failed!"
          # Itt lehetne Slack/Discord webhook értesítés

  # Worker deploy (opcionális, csak ha src változott)
  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    needs: sync
    # Check if push event and files modified in orchestrator directory
    # Note: head_commit.modified may be null, so we use always() with explicit checks
    if: |
      github.event_name == 'push' &&
      github.event.head_commit != null &&
      contains(toJSON(github.event.commits.*.modified), 'bas-cloudflare-orchestrator/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and Deploy
        run: |
          cd bas-cloudflare-orchestrator
          npm install
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
