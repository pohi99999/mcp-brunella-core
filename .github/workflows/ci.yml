name: CI

on:
  push:
    branches: [main, gemini-fication-v2]
  pull_request:
    branches: [main, gemini-fication-v2]

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test
        env:
          WEB_UI_ENABLED: '0'

  vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Vitest
        run: pnpm exec vitest run --reporter=verbose
        timeout-minutes: 3

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Pytest
        run: |
          if [ -d "test" ] && find test -name "*.py" -type f | grep -q .; then
            python -m pytest test -v --tb=short
          else
            echo "No Python tests found in test/ directory"
          fi
        env:
          PYTHONPATH: .

  python-shell-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Setup Python venv
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install -r requirements.txt

      - name: Install Node deps & build
        run: pnpm install --no-frozen-lockfile && pnpm run build

      - name: PythonShell tests
        run: node --loader ts-node/esm --test test/python_shell.test.ts
        env:
          WEB_UI_ENABLED: '0'
