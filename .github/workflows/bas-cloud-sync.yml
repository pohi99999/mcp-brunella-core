# BAS Hybrid Cloud Sync Workflow
# Szinkronizálja a lokális adatokat Cloudflare R2/D1-be

name: BAS Cloud Sync

on:
  # Manuális trigger
  workflow_dispatch:
    inputs:
      sync_type:
        description: "Szinkron típusa"
        required: true
        default: "full"
        type: choice
        options:
          - full
          - snapshot
          - tracks

  # Ütemezett futtatás (naponta 2:00 UTC)
  schedule:
    - cron: "0 2 * * *"

  # Push a main-re (tracks vagy worker source változásnál)
  push:
    branches: [main]
    paths:
      - "conductor/tracks.md"
      - "conductor/tracks/**"
      - "bas-cloudflare-orchestrator/**"

# Self-hosted runner szükséges a lokális fájlok eléréséhez
jobs:
  sync:
    name: Cloud Sync
    runs-on: self-hosted # Lokális runner: G:\Brunella\actions-runner
    if: |
      github.event_name != 'push' ||
      contains(toJSON(github.event.commits.*.modified), 'conductor/tracks.md') ||
      contains(toJSON(github.event.commits.*.modified), 'conductor/tracks/') ||
      contains(toJSON(github.event.commits.*.added), 'conductor/tracks.md') ||
      contains(toJSON(github.event.commits.*.added), 'conductor/tracks/') ||
      contains(toJSON(github.event.commits.*.removed), 'conductor/tracks.md') ||
      contains(toJSON(github.event.commits.*.removed), 'conductor/tracks/')

    steps:
      - name: Validate Secrets
        shell: bash
        run: |
          if [ -z "${{ secrets['CF_BAS_API_TOKEN'] }}" ]; then
            echo "::error::CF_BAS_API_TOKEN secret is not set"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          cd bas-cloudflare-orchestrator
          pnpm install

      - name: Wrangler Login Check
        shell: bash
        run: |
          cd bas-cloudflare-orchestrator
          npx wrangler whoami
        env:
          CF_BAS_API_TOKEN: ${{ secrets['CF_BAS_API_TOKEN'] }}
          CLOUDFLARE_API_TOKEN: ${{ secrets['CF_BAS_API_TOKEN'] }}

      - name: Run Sync
        shell: bash
        run: |
          cd myai
          python sync_to_r2.py ${{ github.event.inputs.sync_type || 'full' }}
        env:
          CF_BAS_API_TOKEN: ${{ secrets['CF_BAS_API_TOKEN'] }}
          CLOUDFLARE_API_TOKEN: ${{ secrets['CF_BAS_API_TOKEN'] }}
          LANCEDB_PATH: "F:/mcp-brunella-core/.lancedb"
          R2_BUCKET: "vodor1"
          R2_PREFIX: "Brunella_core"

      - name: Update D1 Metadata
        if: success()
        shell: bash
        run: |
          cd bas-cloudflare-orchestrator
          # Validate sync_type to prevent SQL injection (only allow known values)
          SYNC_TYPE="${{ github.event.inputs.sync_type || 'full' }}"
          case "$SYNC_TYPE" in
            full|snapshot|tracks)
              npx wrangler d1 execute bas-metadata --command "INSERT INTO sync_log (sync_type, status, source) VALUES ('$SYNC_TYPE', 'completed', 'github-action')"
              ;;
            *)
              echo "Invalid sync_type: $SYNC_TYPE"
              exit 1
              ;;
          esac
        env:
          CF_BAS_API_TOKEN: ${{ secrets['CF_BAS_API_TOKEN'] }}
          CLOUDFLARE_API_TOKEN: ${{ secrets['CF_BAS_API_TOKEN'] }}

      - name: Notify on Failure
        if: failure()
        shell: bash
        run: |
          echo "::error::BAS Cloud Sync failed!"
          # Itt lehetne Slack/Discord webhook értesítés

  # Worker deploy (main push esetén, ha a worker forrása változott)
  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    # Fusson akkor is, ha a track sync job tudatosan kimarad worker-only push esetén.
    if: |
      github.event_name == 'push' &&
      (
        contains(toJSON(github.event.commits.*.modified), 'bas-cloudflare-orchestrator/') ||
        contains(toJSON(github.event.commits.*.added), 'bas-cloudflare-orchestrator/') ||
        contains(toJSON(github.event.commits.*.removed), 'bas-cloudflare-orchestrator/')
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.30.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install and Deploy
        shell: bash
        run: |
          cd bas-cloudflare-orchestrator
          pnpm install
          npx wrangler deploy
        env:
          CF_BAS_API_TOKEN: ${{ secrets['CF_BAS_API_TOKEN'] }}
          CLOUDFLARE_API_TOKEN: ${{ secrets['CF_BAS_API_TOKEN'] }}
