name: BAS Local Sync

on:
  workflow_dispatch:
    inputs:
      sync_type:
        description: "Type of sync (e.g., full, tracks)"
        required: true
        default: "full"
  push:
    branches:
      - main
    paths:
      - "conductor/tracks.md"

jobs:
  run-local-sync:
    runs-on: [self-hosted, Windows, X64, bas]

    steps:
      - name: Validate Secrets
        shell: bash
        run: |
          if [ -z "${{ secrets['CF_BAS_API_TOKEN'] }}" ]; then
            echo "::error::CF_BAS_API_TOKEN secret is not set"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install Python dependencies
        shell: bash
        run: |
          cd myai
          uv sync

      - name: Run Sync Script
        shell: bash
        run: |
          cd myai
          python sync_to_r2.py ${{ github.event.inputs.sync_type || 'full' }}
        env:
          CF_BAS_API_TOKEN: ${{ secrets['CF_BAS_API_TOKEN'] }}
          CLOUDFLARE_API_TOKEN: ${{ secrets['CF_BAS_API_TOKEN'] }}
          LANCEDB_PATH: "F:/mcp-brunella-core/.lancedb"
          R2_BUCKET: "vodor1"
          R2_PREFIX: "Brunella_core"
