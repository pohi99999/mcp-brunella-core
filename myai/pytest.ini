[pytest]
testpaths = tests

# Disable cache provider to avoid __pycache__ file locks on Windows
# Disable warnings to reduce noise
addopts =
    --basetemp=.pytest_tmp
    -p no:cacheprovider
    -p no:warnings
    --tb=short
    -v

# Increase timeout for slow tests (especially those with LanceDB/embeddings)
timeout = 300

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    windows: Run only on Windows
    slow: Slow running tests
    integration: Integration tests requiring external dependencies
