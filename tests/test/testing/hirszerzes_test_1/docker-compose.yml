version: '3.8'

services:
  # ============================================
  # LANGFLOW - Agent Orchestration Platform
  # ============================================
  langflow:
    image: langflowai/langflow:latest
    container_name: ai-research-langflow
    ports:
      - "7860:7860"
    environment:
      # Database
      - LANGFLOW_DATABASE_URL=sqlite:///app/langflow/langflow.db
      
      # API Keys (töltsd ki a sajátjaiddal!)
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      
      # Telegram Bot (értesítésekhez)
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      
      # ChromaDB connection
      - CHROMADB_PATH=/app/chromadb_data
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      
      # Ollama connection
      - OLLAMA_BASE_URL=http://ollama:11434
      
      # Langflow settings
      - LANGFLOW_AUTO_LOGIN=false
      - LANGFLOW_SUPERUSER=${LANGFLOW_SUPERUSER:-admin}
      - LANGFLOW_SUPERUSER_PASSWORD=${LANGFLOW_SUPERUSER_PASSWORD:-admin123}
      - LANGFLOW_SECRET_KEY=${LANGFLOW_SECRET_KEY:-your-secret-key-here}
      
      # Performance
      - LANGFLOW_WORKERS=4
      - LANGFLOW_MAX_FILE_SIZE=10485760  # 10MB
    
    volumes:
      # Perzisztens adatok
      - langflow-data:/app/langflow
      - chromadb-data:/app/chromadb_data
      - ./backup:/tmp  # JSON backup-ok helyi mentéshez
      
    depends_on:
      - ollama
      - chromadb
    
    networks:
      - ai-research-network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # OLLAMA - Local LLM Runtime
  # ============================================
  ollama:
    image: ollama/ollama:latest
    container_name: ai-research-ollama
    ports:
      - "11434:11434"
    
    volumes:
      - ollama-data:/root/.ollama
    
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=2
      
      # GPU support (ha van NVIDIA GPU)
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    
    # Uncomment ha NVIDIA GPU-t használsz
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    
    networks:
      - ai-research-network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # CHROMADB - Vector Database
  # ============================================
  chromadb:
    image: chromadb/chroma:latest
    container_name: ai-research-chromadb
    ports:
      - "8000:8000"
    
    volumes:
      - chromadb-data:/chroma/chroma
    
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=False
      - ALLOW_RESET=TRUE
      - CHROMA_SERVER_AUTH_CREDENTIALS_PROVIDER=chromadb.auth.token.TokenConfigServerAuthCredentialsProvider
      - CHROMA_SERVER_AUTH_TOKEN_TRANSPORT_HEADER=X_CHROMA_TOKEN
      - CHROMA_SERVER_AUTH_CREDENTIALS=${CHROMA_AUTH_TOKEN:-default_token_change_me}
    
    networks:
      - ai-research-network
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================
  # POSTGRES - Langflow Database (opcionális)
  # Ha nagyobb skálázhatóság kell SQLite helyett
  # ============================================
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: ai-research-postgres
  #   ports:
  #     - "5432:5432"
  #   environment:
  #     - POSTGRES_USER=langflow
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-langflow123}
  #     - POSTGRES_DB=langflow
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data
  #   networks:
  #     - ai-research-network
  #   restart: unless-stopped

# ============================================
# VOLUMES - Perzisztens adattárolás
# ============================================
volumes:
  langflow-data:
    driver: local
  ollama-data:
    driver: local
  chromadb-data:
    driver: local
  # postgres-data:
  #   driver: local

# ============================================
# NETWORKS
# ============================================
networks:
  ai-research-network:
    driver: bridge
