name: Jules Async Tests

on:
  schedule:
    - cron: "0 */4 * * *" # every 4 hours
  workflow_dispatch:
    inputs:
      suite:
        description: "Which test suite to run (unit_fast | dashboard | e2e). Leave empty to run all."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: jules-async-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  async-tests:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3  # Csökkentve 15-ről 3-ra a terhelés csökkentése érdekében
      matrix:
        suite:
          - unit_fast
          - integration_ollama
          - dashboard
          - security_scan
          - api_contracts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.30.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run selected suite
        shell: bash
        run: |
          set -euo pipefail

          # If workflow_dispatch input provided, override matrix to just that suite.
          if [[ "${{ github.event.inputs.suite }}" != "" ]]; then
            SUITE="${{ github.event.inputs.suite }}"
          else
            SUITE="${{ matrix.suite }}"
          fi

          echo "Running suite: $SUITE"

          case "$SUITE" in
            unit_fast)
              pnpm test -- --run --reporter=verbose
              ;;
            unit_slow)
              pnpm test -- --run --reporter=verbose --testTimeout=60000
              ;;
            integration_ollama)
              pnpm test -- --run test/ollama*.test.ts test/llm*.test.ts
              ;;
            integration_gemini)
              pnpm test -- --run test/gemini*.test.ts
              ;;
            integration_github_models)
              pnpm test -- --run test/github*.test.ts
              ;;
            dashboard)
              pnpm run build:ui
              ;;
            e2e_full)
              pnpm run test:e2e || echo "E2E suite not yet implemented"
              ;;
            e2e_critical)
              pnpm run test:e2e:critical || echo "E2E critical suite not yet implemented"
              ;;
            performance_stress)
              pnpm run test:perf || echo "Performance suite not yet implemented"
              ;;
            performance_memory)
              pnpm run test:perf:memory || echo "Memory suite not yet implemented"
              ;;
            security_scan)
              pnpm audit --audit-level=moderate || true
              ;;
            api_contracts)
              pnpm test -- --run test/*_routes.test.ts
              ;;
            accessibility)
              pnpm run test:a11y || echo "Accessibility suite not yet implemented"
              ;;
            browser_compat)
              pnpm run test:browsers || echo "Browser compat suite not yet implemented"
              ;;
            regression)
              pnpm test -- --run --reporter=verbose --changed
              ;;
            *)
              echo "Unknown suite: $SUITE" >&2
              exit 1
              ;;
          esac
