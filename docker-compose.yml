version: '3.8'

services:
  # Brunella Core (Node.js/TypeScript)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: brunella-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - BRUNELLA_PYTHON_API_URL=http://ai-worker:8000
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - BRUNELLA_WORKSPACE_ROOT=/app
    volumes:
      - .:/app # Bind mount full workspace for development
      - /app/node_modules # Persistent node_modules inside container
      - ./logs:/app/logs
    depends_on:
      - ai-worker
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # AI Subsystem (Python/FastAPI)
  ai-worker:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: brunella-ai
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    volumes:
      - ./myai:/app/myai # Bind mount python code
      - ./logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"