services:
  brunella-core:
    build:
      context: .
      dockerfile: Dockerfile.node
    container_name: brunella-core
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      BRUNELLA_NODE_MAX_OLD_SPACE_SIZE: 1536
      BRUNELLA_RUNTIME_MEMORY_LIMIT_MB: 2048
      BRUNELLA_RUNTIME_RESTART_THRESHOLD_MB: 1792
      PYTHON_API_URL: http://brunella-ai:8000
      PYTHON_BASE_URL: http://brunella-ai:8000
      BRUNELLA_PYTHON_API_URL: http://brunella-ai:8000
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      BRUNELLA_WORKSPACE_ROOT: /app
    ports:
      - "3000:3000"
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 2g
    memswap_limit: 2g
    depends_on:
      brunella-ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/readyz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    volumes:
      - brunella_core_data:/app/data
      - brunella_core_logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"

  brunella-ai:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: brunella-ai
    init: true
    environment:
      PYTHONUNBUFFERED: 1
    ports:
      - "8000:8000"
    restart: unless-stopped
    stop_grace_period: 20s
    mem_limit: 1g
    memswap_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 4s
      start_period: 20s
      retries: 3
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    volumes:
      - brunella_ai_logs:/app/logs
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  brunella_core_data:
  brunella_core_logs:
  brunella_ai_logs:
